<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Petzker Cookware — Team App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #2E7BEE;
      --blue-light: #EBF3FD;
      --orange: #F0921A;
      --orange-light: #FEF3E2;
      --bg: #F6F8FA;
      --surface: #FFFFFF;
      --border: #E8ECF0;
      --text: #1A1D23;
      --text-muted: #8A94A0;
      --green: #22C55E;
      --green-light: #F0FDF4;
      --red: #EF4444;
      --red-light: #FEF2F2;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--blue);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-icon svg { width: 20px; height: 20px; }
    .logo-text { font-size: 15px; font-weight: 700; color: var(--text); }
    .logo-text span { color: var(--orange); }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 4px;
    }
    .tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }

    /* ── VIEWS ── */
    .view { display: none; padding: 20px; }
    .view.active { display: block; }

    /* ── CALENDAR ── */
    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .month-label {
      font-size: 17px;
      font-weight: 700;
      text-transform: capitalize;
    }
    .nav-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.15s;
      font-size: 16px;
    }
    .nav-btn:hover { border-color: var(--blue); color: var(--blue); }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }
    .weekday {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .day-cell {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: var(--surface);
      border: 1.5px solid transparent;
      transition: all 0.15s;
      position: relative;
      padding: 4px 2px;
    }
    .day-cell:hover:not(.empty):not(.past) { border-color: var(--blue); }
    .day-cell.empty { background: transparent; cursor: default; }
    .day-cell.past { opacity: 0.35; cursor: default; }
    .day-cell.today {
      border-color: var(--blue);
      color: var(--blue);
      font-weight: 700;
    }
    .day-cell.weekend-day { color: var(--red); }
    .day-cell.has-one { border-color: var(--green); }
    .day-cell.has-two { border-color: var(--orange); background: var(--orange-light); }
    .day-cell.full { border-color: var(--red); background: var(--red-light); opacity: 0.6; cursor: not-allowed; }

    .day-num { font-size: 13px; line-height: 1; }
    .day-dots {
      display: flex;
      gap: 2px;
      margin-top: 3px;
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--blue);
    }
    .dot.orange { background: var(--orange); }
    .dot.red { background: var(--red); }

    /* ── LEGEND ── */
    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin: 16px 0;
      padding: 14px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }

    /* ── UPCOMING ── */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin: 20px 0 10px;
    }
    .upcoming-list { display: flex; flex-direction: column; gap: 8px; }
    .upcoming-item {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
    }
    .upcoming-date {
      min-width: 42px;
      text-align: center;
      background: var(--blue-light);
      border-radius: 8px;
      padding: 6px 4px;
    }
    .upcoming-date .ud-day { font-size: 18px; font-weight: 700; color: var(--blue); line-height: 1; }
    .upcoming-date .ud-mon { font-size: 10px; color: var(--blue); font-weight: 600; text-transform: uppercase; }
    .upcoming-names { flex: 1; }
    .name-chip {
      display: inline-block;
      background: var(--blue-light);
      color: var(--blue);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 500;
      margin: 2px 3px 2px 0;
    }
    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ── MODAL ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 24px 24px 36px;
      width: 100%;
      max-width: 480px;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .modal-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    .modal-who {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .who-chip {
      background: var(--blue-light);
      color: var(--blue);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 500;
    }
    .modal-input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      background: var(--bg);
    }
    .modal-input:focus { border-color: var(--blue); }
    .modal-input.error { border-color: var(--red); }
    .modal-error { color: var(--red); font-size: 12px; margin-top: 6px; display: none; }
    .modal-error.show { display: block; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-primary {
      flex: 1;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary {
      padding: 14px 20px;
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-remove {
      width: 100%;
      padding: 13px;
      background: var(--red-light);
      color: var(--red);
      border: 1px solid #FECACA;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
    }

    /* ── DIARY ── */
    #view-diary {
      padding: 0;
    }
    .diary-bg {
      min-height: calc(100vh - 120px);
      background:
        linear-gradient(to bottom, transparent 39px, #E8D8C4 39px),
        linear-gradient(to right, transparent 48px, transparent 48px);
      background-size: 100% 40px, 100% 100%;
      background-color: #FDF8F0;
      padding: 20px 20px 20px 60px;
      position: relative;
    }
    .diary-margin-line {
      position: absolute;
      left: 52px;
      top: 0;
      bottom: 0;
      width: 1.5px;
      background: #F0C4C0;
      pointer-events: none;
    }
    .diary-header-strip {
      background: #FDF8F0;
      padding: 20px 20px 14px;
      border-bottom: 2px solid #E8D8C4;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .diary-title {
      font-family: 'Caveat', cursive;
      font-size: 26px;
      font-weight: 600;
      color: #7C5C3A;
      margin-bottom: 2px;
    }
    .diary-subtitle {
      font-size: 12px;
      color: #B89A7A;
      font-style: italic;
    }
    .diary-new-entry {
      margin-bottom: 24px;
    }
    .diary-date-label {
      font-family: 'Caveat', cursive;
      font-size: 15px;
      color: #B89A7A;
      margin-bottom: 8px;
    }
    .diary-textarea {
      width: 100%;
      min-height: 100px;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Caveat', cursive;
      font-size: 18px;
      color: #3D2B1A;
      resize: none;
      line-height: 40px;
      padding: 2px 0;
    }
    .diary-textarea::placeholder { color: #C4A882; }
    .diary-add-btn {
      margin-top: 6px;
      padding: 10px 22px;
      background: #7C5C3A;
      color: white;
      border: none;
      border-radius: 20px;
      font-family: 'Caveat', cursive;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .diary-add-btn:hover { opacity: 0.85; }
    .diary-divider {
      height: 1px;
      background: #E8D8C4;
      margin: 20px 0;
    }
    .diary-entries { display: flex; flex-direction: column; gap: 0; }
    .diary-entry {
      padding: 12px 0;
      border-bottom: 1px dashed #DDD0C0;
    }
    .diary-entry-date {
      font-family: 'Caveat', cursive;
      font-size: 13px;
      color: #B89A7A;
      margin-bottom: 4px;
    }
    .diary-entry-text {
      font-family: 'Caveat', cursive;
      font-size: 18px;
      color: #3D2B1A;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .diary-empty {
      font-family: 'Caveat', cursive;
      font-size: 17px;
      color: #C4A882;
      text-align: center;
      padding: 32px 0;
      font-style: italic;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1A1D23;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.25s;
      z-index: 300;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="16.5" y1="5" x2="19" y2="2"/>
        <line x1="2" y1="18" x2="5" y2="21" stroke-width="3"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">Petzker <span>Cookware</span></div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('calendar')">📅 Выходные</button>
    <button class="tab" onclick="switchTab('diary')">📓 Дневник оптимиста</button>
  </div>
</div>

<!-- CALENDAR VIEW -->
<div id="view-calendar" class="view active">
  <div class="calendar-nav">
    <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
    <div class="month-label" id="month-label"></div>
    <button class="nav-btn" onclick="changeMonth(1)">›</button>
  </div>

  <div class="weekdays">
    <div class="weekday">Пн</div><div class="weekday">Вт</div>
    <div class="weekday">Ср</div><div class="weekday">Чт</div>
    <div class="weekday">Пт</div>
    <div class="weekday" style="color:var(--red)">Сб</div>
    <div class="weekday" style="color:var(--red)">Вс</div>
  </div>
  <div class="calendar-grid" id="calendar-grid"></div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--green)"></div> 1 человек
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--orange)"></div> 2 человека
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--red)"></div> Мест нет
    </div>
  </div>

  <div class="section-title">Ближайшие выходные</div>
  <div class="upcoming-list" id="upcoming-list"></div>
</div>

<!-- DIARY VIEW -->
<div id="view-diary" class="view">
  <div class="diary-header-strip">
    <div class="diary-title">Дневник оптимиста ✨</div>
    <div class="diary-subtitle">Пишите мысли — пусть хорошее останется</div>
  </div>
  <div class="diary-bg">
    <div class="diary-margin-line"></div>
    <div class="diary-new-entry">
      <div class="diary-date-label" id="diary-today-label"></div>
      <textarea class="diary-textarea" id="diary-input"
        placeholder="Что хорошего было сегодня или вчера?.."></textarea>
      <button class="diary-add-btn" onclick="addDiaryEntry()">Записать ✦</button>
    </div>
    <div class="diary-divider"></div>
    <div class="diary-entries" id="diary-entries"></div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="modal-who" id="modal-who"></div>
    <div id="modal-form">
      <input class="modal-input" id="name-input" type="text"
             placeholder="Ваше имя" maxlength="30"
             onkeydown="if(event.key==='Enter') confirmDay()" />
      <div class="modal-error" id="modal-error"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Отмена</button>
        <button class="btn-primary" onclick="confirmDay()">Взять выходной</button>
      </div>
      <button class="btn-remove" id="remove-btn" onclick="removeMyself()" style="display:none">
        Убрать свой выходной
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// STORAGE  (localStorage — works on GitHub Pages)
// ═══════════════════════════════════════════════
const STORAGE_KEY = 'petzker_vacations_v2';
const DIARY_KEY   = 'petzker_diary_v1';

function loadVacations() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveVacations(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function loadDiary() {
  try { return JSON.parse(localStorage.getItem(DIARY_KEY)) || []; }
  catch { return []; }
}
function saveDiary(data) {
  localStorage.setItem(DIARY_KEY, JSON.stringify(data));
}

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
const today = new Date();
let curYear  = today.getFullYear();
let curMonth = today.getMonth();
let selectedKey = null;
let vacations   = loadVacations();

// ═══════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (i === 0) === (tab === 'calendar'));
  });
  document.getElementById('view-calendar').classList.toggle('active', tab === 'calendar');
  document.getElementById('view-diary').classList.toggle('active', tab === 'diary');
  if (tab === 'diary') renderDiary();
}

// ═══════════════════════════════════════════════
// CALENDAR
// ═══════════════════════════════════════════════
const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                   'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_RU_GEN = ['января','февраля','марта','апреля','мая','июня',
                        'июля','августа','сентября','октября','ноября','декабря'];

function dayKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function changeMonth(dir) {
  curMonth += dir;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  if (curMonth < 0)  { curMonth = 11; curYear--; }
  // don't go before current month
  if (curYear < today.getFullYear() ||
      (curYear === today.getFullYear() && curMonth < today.getMonth())) {
    curMonth = today.getMonth(); curYear = today.getFullYear();
  }
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('month-label').textContent =
    `${MONTHS_RU[curMonth]} ${curYear}`;

  const grid = document.getElementById('calendar-grid');
  grid.innerHTML = '';

  const firstDay = new Date(curYear, curMonth, 1).getDay(); // 0=Sun
  const shift = (firstDay === 0) ? 6 : firstDay - 1;       // Mon-based
  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();

  for (let i = 0; i < shift; i++) {
    const el = document.createElement('div');
    el.className = 'day-cell empty';
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const key  = dayKey(curYear, curMonth, d);
    const date = new Date(curYear, curMonth, d);
    const dow  = date.getDay();
    const isWeekend = (dow === 0 || dow === 6);
    const isPast = date < new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const names  = vacations[key] || [];
    const count  = names.length;

    const cell = document.createElement('div');
    cell.className = 'day-cell';
    if (isWeekend) cell.classList.add('weekend-day');
    if (isPast)    cell.classList.add('past');
    if (date.toDateString() === today.toDateString()) cell.classList.add('today');
    if (count === 1) cell.classList.add('has-one');
    if (count === 2) cell.classList.add('has-two');
    if (count >= 2)  cell.classList.add('full');

    let dots = '';
    if (count > 0) {
      dots = '<div class="day-dots">' +
        names.slice(0,2).map((_, i) =>
          `<div class="dot ${count >= 2 ? 'orange' : ''}"></div>`
        ).join('') +
        '</div>';
    }

    cell.innerHTML = `<div class="day-num">${d}</div>${dots}`;

    if (!isPast) {
      cell.addEventListener('click', () => openModal(key, d));
    }

    grid.appendChild(cell);
  }

  renderUpcoming();
}

// ─── UPCOMING LIST ───
function renderUpcoming() {
  const list = document.getElementById('upcoming-list');
  list.innerHTML = '';

  const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const cutoff = new Date(todayMidnight);
  cutoff.setDate(cutoff.getDate() + 60);

  const relevant = Object.entries(vacations)
    .filter(([k, v]) => {
      const d = new Date(k);
      return d >= todayMidnight && d <= cutoff && v.length > 0;
    })
    .sort(([a],[b]) => a.localeCompare(b))
    .slice(0, 10);

  if (!relevant.length) {
    list.innerHTML = '<div class="empty-state">Пока нет запланированных выходных</div>';
    return;
  }

  relevant.forEach(([key, names]) => {
    const d = new Date(key + 'T00:00:00');
    const item = document.createElement('div');
    item.className = 'upcoming-item';
    item.innerHTML = `
      <div class="upcoming-date">
        <div class="ud-day">${d.getDate()}</div>
        <div class="ud-mon">${MONTHS_RU_GEN[d.getMonth()].slice(0,3)}</div>
      </div>
      <div class="upcoming-names">
        ${names.map(n => `<span class="name-chip">${n}</span>`).join('')}
      </div>`;
    list.appendChild(item);
  });
}

// ═══════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════
function openModal(key, day) {
  selectedKey = key;
  const names = vacations[key] || [];
  const d = new Date(key + 'T00:00:00');
  const full = names.length >= 2;

  document.getElementById('modal-title').textContent =
    `${day} ${MONTHS_RU_GEN[d.getMonth()]} ${d.getFullYear()}`;

  const whoDiv = document.getElementById('modal-who');
  if (names.length) {
    whoDiv.innerHTML = names.map(n => `<span class="who-chip">${n}</span>`).join('');
    whoDiv.style.display = 'flex';
  } else {
    whoDiv.style.display = 'none';
  }

  if (full) {
    document.getElementById('modal-sub').textContent = '😅 Уже 2 человека — мест нет!';
    document.getElementById('modal-form').style.display = 'none';
  } else {
    document.getElementById('modal-sub').textContent =
      names.length ? 'Ещё одно место свободно!' : 'Запишите своё имя';
    document.getElementById('modal-form').style.display = 'block';
  }

  document.getElementById('modal-error').classList.remove('show');
  document.getElementById('name-input').value = '';
  document.getElementById('name-input').classList.remove('error');
  document.getElementById('remove-btn').style.display = 'none';

  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('name-input').focus(), 200);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  selectedKey = null;
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function confirmDay() {
  const nameEl = document.getElementById('name-input');
  const errEl  = document.getElementById('modal-error');
  const name   = nameEl.value.trim();

  errEl.classList.remove('show');
  nameEl.classList.remove('error');

  if (!name) {
    nameEl.classList.add('error');
    errEl.textContent = 'Пожалуйста, введите имя';
    errEl.classList.add('show');
    return;
  }

  if (!vacations[selectedKey]) vacations[selectedKey] = [];
  const list = vacations[selectedKey];

  if (list.includes(name)) {
    // show remove btn
    document.getElementById('remove-btn').style.display = 'block';
    errEl.textContent = `${name} уже записан — хотите убрать?`;
    errEl.classList.add('show');
    return;
  }

  if (list.length >= 2) {
    errEl.textContent = 'Мест нет! Максимум 2 человека.';
    errEl.classList.add('show');
    return;
  }

  list.push(name);
  saveVacations(vacations);
  closeModal();
  renderCalendar();
  showToast(`✅ ${name} записан на выходной!`);
}

function removeMyself() {
  const name = document.getElementById('name-input').value.trim();
  if (!name || !vacations[selectedKey]) return;
  vacations[selectedKey] = vacations[selectedKey].filter(n => n !== name);
  if (!vacations[selectedKey].length) delete vacations[selectedKey];
  saveVacations(vacations);
  closeModal();
  renderCalendar();
  showToast(`Выходной для ${name} убран`);
}

// ═══════════════════════════════════════════════
// DIARY
// ═══════════════════════════════════════════════
function renderDiary() {
  const days = ['воскресенье','понедельник','вторник','среда',
                'четверг','пятница','суббота'];
  const label = `${days[today.getDay()]}, ${today.getDate()} ${MONTHS_RU_GEN[today.getMonth()]}`;
  document.getElementById('diary-today-label').textContent = label;

  const entries = loadDiary();
  const container = document.getElementById('diary-entries');
  container.innerHTML = '';

  if (!entries.length) {
    container.innerHTML = '<div class="diary-empty">Пока пусто... Напишите первым ✦</div>';
    return;
  }

  [...entries].reverse().forEach(e => {
    const div = document.createElement('div');
    div.className = 'diary-entry';
    div.innerHTML = `
      <div class="diary-entry-date">${e.date}</div>
      <div class="diary-entry-text">${escHtml(e.text)}</div>`;
    container.appendChild(div);
  });
}

function addDiaryEntry() {
  const ta = document.getElementById('diary-input');
  const text = ta.value.trim();
  if (!text) return;

  const days = ['воскресенье','понедельник','вторник','среда',
                'четверг','пятница','суббота'];
  const now = new Date();
  const dateStr = `${days[now.getDay()]}, ${now.getDate()} ${MONTHS_RU_GEN[now.getMonth()]}`;

  const entries = loadDiary();
  entries.push({ date: dateStr, text });
  saveDiary(entries);

  ta.value = '';
  renderDiary();
  showToast('✦ Записано!');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/\n/g,'<br>');
}

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
renderCalendar();

// Telegram Web App integration
if (window.Telegram && window.Telegram.WebApp) {
  const twa = window.Telegram.WebApp;
  twa.ready();
  twa.expand();
}
</script>
